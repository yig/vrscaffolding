<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Drawing with Scaffolds</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			Drawing with Scaffolds
			<div id="duration"></div>
		</div>

		<script src="./js/HelioWebXRPolyfill.js"></script>

		<script type="module">

			import * as THREE from './js/three.module.js';
			import { OrbitControls } from './js/OrbitControls.js';
			import { TubePainter } from './js/TubePainter.js';
			import { VRButton } from './js/VRButton.js';
			import { BoxLineGeometry } from './js/BoxLineGeometry.js';
			import { XRControllerModelFactory } from './js/XRControllerModelFactory.js';
			import { WebSocketClient } from './js/websocket-client.js';

			var container;
			var camera, scene, renderer;
			var controller1, controller2;
			var controllerGrip1, controllerGrip2;
			
			var scaffold_strokes, shape_strokes;
			
			var room;
			
			// try pass cursor data to backend
			var cursor = new THREE.Vector3();

			var controls;
			
			var socket;
			var avg_duration;
			var last_durations = [];
			var last_durations_index = 0;

			init();
			initWebSocket();
			animate();

			drawAxes(scene);
			
			function init() {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x222222 );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 50 );
				camera.position.set( 0, 1.6, 3 );

				controls = new OrbitControls( camera, container );
				controls.target.set( 0, 1.6, 0 );
				controls.update();

				room = new THREE.LineSegments(
					new BoxLineGeometry( 6, 6, 6, 10, 10, 10 ),
					new THREE.LineBasicMaterial( { color: 0x505050 } )
				);
				room.geometry.translate( 0, 3, 0 );
				scene.add( room );

				scene.add( new THREE.HemisphereLight( 0x888877, 0x777788 ) );

				var light = new THREE.DirectionalLight( 0xffffff, 0.5 );
				light.position.set( 0, 4, 0 );
				scene.add( light );

				//

				var painter1 = new TubePainter();
				// painter1.setColor( 0xe0e0ff );
				scene.add( painter1.mesh );

				var painter2 = new TubePainter();
				// painter2.setColor( 0xffe0ff );
				scene.add( painter2.mesh );
				
				
				// Make groups for the user's input
				scaffold_strokes = new THREE.Group();
				shape_strokes = new THREE.Group();
				scene.add( scaffold_strokes );
				scene.add( shape_strokes );



				// renderer

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.outputEncoding = THREE.sRGBEncoding;
				renderer.xr.enabled = true;
				container.appendChild( renderer.domElement );

				document.body.appendChild( VRButton.createButton( renderer ) );

				// controllers

				function onSelectStart() {
					this.userData.isSelecting = true;

					// Tell the userData that we've finished.
					if( this.userData.selectStart !== undefined ) this.userData.selectStart();
				}

				function onSelectEnd() {
					this.userData.isSelecting = false;

					// Tell the userData that we've finished.
					if( this.userData.selectEnd !== undefined ) this.userData.selectEnd();
				}

				function onSequeezeStart() {

					this.userData.isSqueezing = true;
					this.userData.positionAtSqueezeStart = this.position.y;
					this.userData.scaleAtSqueezeStart = this.scale.x;

				}

				function onSqueezeEned() {

					this.userData.isSqueezing = false;

				}

				function startStroke() {
					let userData = this;
					userData.active_stroke = [];
				}
				function submitStroke() {
					let userData = this;
					// A stroke is finished.
					socket.send( "new-stroke " + JSON.stringify( userData.active_stroke ) );
					console.log(userData.active_stroke.length);
					console.log( "draw ended" );
				}

				controller1 = renderer.xr.getController( 0 );
				controller1.addEventListener( 'selectstart', onSelectStart );
				controller1.addEventListener( 'selectend', onSelectEnd );
				controller1.addEventListener( 'squeezestart', onSequeezeStart );
				controller1.addEventListener( 'squeezeend', onSqueezeEned );
				controller1.userData.painter = painter1;
				controller1.userData.active_stroke = [];
				controller1.userData.selectStart = startStroke;
				controller1.userData.selectEnd = submitStroke;
				scene.add( controller1 );

				controller2 = renderer.xr.getController( 1 );
				controller2.addEventListener( 'selectstart', onSelectStart );
				controller2.addEventListener( 'selectend', onSelectEnd );
				controller2.addEventListener( 'squeezestart', onSequeezeStart );
				controller2.addEventListener( 'squeezeend', onSqueezeEned );
				controller2.userData.painter = painter2;
				controller2.userData.selectStart = startStroke;
				controller2.userData.selectEnd = submitStroke;
				scene.add( controller2 );

				
				// Add the pawn geometry for each controller.
				// This is used in handleController() to set the cursor position.
				var geometry = new THREE.CylinderBufferGeometry( 0.01, 0.02, 0.08, 5 );
				geometry.rotateX( - Math.PI / 2 );
				var material = new THREE.MeshStandardMaterial( { flatShading: true } );
				var mesh = new THREE.Mesh( geometry, material );

				var pivot = new THREE.Mesh( new THREE.IcosahedronBufferGeometry( 0.01, 2 ) );
				pivot.name = 'pivot';
				pivot.position.z = - 0.05;
				mesh.add( pivot );

				controller1.add( mesh.clone() );
				controller2.add( mesh.clone() );
				
				
				// The XRControllerModelFactory will automatically fetch controller models
				// that match what the user is holding as closely as possible. The models
				// should be attached to the object returned from getControllerGrip in
				// order to match the orientation of the held device.

				var controllerModelFactory = new XRControllerModelFactory();

				controllerGrip1 = renderer.xr.getControllerGrip( 0 );
				controllerGrip1.add( controllerModelFactory.createControllerModel( controllerGrip1 ) );
				scene.add( controllerGrip1 );

				controllerGrip2 = renderer.xr.getControllerGrip( 1 );
				controllerGrip2.add( controllerModelFactory.createControllerModel( controllerGrip2 ) );
				scene.add( controllerGrip2 );

				// 

				window.addEventListener( 'resize', onWindowResize, false );

			}

			async function initWebSocket() {
                // Let's use WebSocketClient library, which supports await: https://github.com/jcao219/websocket-async
                // Write a websockets server using: http://websockets.readthedocs.io/en/stable/intro.html
                socket = new WebSocketClient;
                
                // Socket from URL in modern JavaScript: https://stackoverflow.com/questions/979975/how-to-get-the-value-from-the-get-parameters
                var url = new URL( window.location.href );
                var port = 9000;
                if( url.searchParams.has("port") ) {
                    port = parseInt( url.searchParams.get("port") );
                }
                
                await socket.connect('ws://localhost:' + port);
                console.log( "Connected on port " + port + ": ", socket.connected );
                
                // To simulate an .onmessage() callback:
                // TODO Q: What happens if you call socket.disconnect() and socket.connect() during an await?
                while( true ) {
                    const msg = await socket.receive();

					var cmd = msg.substr(0,msg.indexOf(' '));
					var payload = JSON.parse( msg.substr(msg.indexOf(' ')+1) );
    
                    // process the msg
					if( cmd == "new-straight-line" ) {
						console.log( payload )
						draw_line( payload );
					}
					else if( cmd == "..." ) {
						//
					}
					else {
						console.error( "Unknown message:", msg );
					}
                }
                
                
                // The time in seconds since some arbitrary point in time.
                function now() {
                    return ( new Date().getTime() ) / 1000.;
                }
                while( true ) {
                    const start = now();
					// socket.send( JSON.stringify(cursor_active_stroke) );
                    // socket.send("ping");

			
                    const msg = await socket.receive();
                    const duration = now() - start;
                    // console.log( "duration:", duration );
                    avg_duration = avg_duration !== undefined ? .99*avg_duration + 0.01*duration : duration;
                    // document.getElementById( 'duration' ).innerHTML = 'avg duration: ' + avg_duration.toFixed(4) + ', duration: ' + duration.toFixed(4);
                    
                    // Also compute the median.
                    last_durations[ last_durations_index ] = duration;
                    last_durations_index = ( last_durations_index + 1 ) % 11;
                    let last_durations_sorted = last_durations.slice();
                    last_durations_sorted.sort( (a, b) => a - b );
                    const median = last_durations_sorted[ Math.floor( last_durations_sorted.length/2 ) ];
                    document.getElementById( 'duration' ).innerHTML = (
                        'avg duration: ' + avg_duration.toFixed(4)
                        +
                        ', median duration: ' + median.toFixed(4)
                        +
                        ', duration: ' + duration.toFixed(4)
                        );
                }
            }

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function handleController( controller ) {

				var userData = controller.userData;
				var painter = userData.painter;

				var pivot = controller.getObjectByName( 'pivot' );

				if ( userData.isSqueezing === true ) {

					var delta = ( controller.position.y - userData.positionAtSqueezeStart ) * 5;
					var scale = Math.max( 0.1, userData.scaleAtSqueezeStart + delta );

					pivot.scale.setScalar( scale );
					painter.setSize( scale );
				}

				cursor.setFromMatrixPosition( pivot.matrixWorld );



				if ( userData.isSelecting === true ) {

					painter.lineTo( cursor );
					painter.update();

					// console.log(cursor);
					userData.active_stroke.push( cursor.clone() );
				} else {

					painter.moveTo( cursor );
				}


			}

			function animate() {

				renderer.setAnimationLoop( render );

			}

			function render() {

				handleController( controller1 );
				handleController( controller2 );

				renderer.render( scene, camera );

			}


			// add line to 
			// Three.js draw line
			function draw_line( payload ) {

				var material = new THREE.LineBasicMaterial( { 
					color: 0xffff00,
					linewidth: 10,
					linecap: 'round',
					linejoin: 'round' 
				} );

				var p0 = payload[0];
				var p1 = payload[1];
				
				var points = [];
				points.push( new THREE.Vector3( p0[0], p0[1], p0[2]) );
				points.push( new THREE.Vector3( p1[0], p1[1], p1[2]) );
				
				var geometry = new THREE.BufferGeometry().setFromPoints( points );
				
				var line = new THREE.Line( geometry, material );

				scene.add( line );
				renderer.render( scene, camera );
			}

			function drawAxes(scene) {


				// colors
				var red = new THREE.Color(1, 0, 0);
				var green = new THREE.Color(0, 1, 0);
				var blue = new THREE.Color(0, 0, 1);


				var origin = new THREE.Vector3( 0, 0, 0 );
				var length = 1;

				// x-axis
				var xdir = new THREE.Vector3(1, 0, 0)
				var xAxis = new THREE.ArrowHelper(xdir, origin, length, red);
				scene.add(xAxis);

				// y-axis
				var ydir = new THREE.Vector3(0, 1, 0);
				var yAxis = new THREE.ArrowHelper(ydir, origin, length, green);
				scene.add(yAxis);

				// z-axis
				var zdir = new THREE.Vector3(0, 0, 1);
				var zAxis = new THREE.ArrowHelper(zdir, origin, length, blue);
				scene.add(zAxis);
			}

			
		</script>
	</body>
</html>
